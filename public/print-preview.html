<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Undangan Resmi Mitra (Tanpa Barcode) • Waroeng Latte Madiun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#112250',
                        sapphire: '#3B507D',
                        warmTaupe: '#BEB7A7',
                        champagne: '#E7E2CE',
                        ivory: '#F5F4F0'
                    }
                }
            }
        }
    </script>
    <style>
        .invitation-badge {
            width: 330px;
            height: 480px;
            background: #112250;
            color: #F5F4F0;
            position: relative;
            box-sizing: border-box;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 22px;
            border: 1.5px solid #E7E2CE;
            box-shadow: 0 12px 35px rgba(17, 34, 80, 0.45);
        }

        .invitation-badge::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 1px solid #BEB7A7;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0.6;
        }

        @media print {
            body {
                background: #ffffff !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-container {
                display: grid !important;
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 12mm !important;
                padding: 8mm !important;
            }
            .invitation-badge {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
                box-shadow: none !important;
                border: 1.5px solid #112250 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body class="bg-navy text-ivory min-h-screen selection:bg-champagne selection:text-navy">

    <!-- Control Bar (Hidden on Print) -->
    <header class="no-print sticky top-0 z-50 bg-navy/95 backdrop-blur border-b border-warmTaupe/30 p-4">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3.5">
                <a href="/" class="w-9 h-9 rounded-xl bg-sapphire/50 hover:bg-sapphire border border-warmTaupe/30 flex items-center justify-center text-ivory transition" title="Dashboard">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div>
                    <h1 class="text-sm font-bold text-champagne font-luxury flex items-center gap-2">
                        KARTU UNDANGAN RESMI MITRA MADIUN
                        <span class="text-[10px] font-sans font-semibold px-2 py-0.5 rounded-full bg-champagne/15 text-champagne border border-champagne/30">Layout A6 Bersih</span>
                    </h1>
                    <p class="text-[11px] text-warmTaupe">11 November 2026 • Waroeng Latte, Jl. Cokroaminoto No.88, Kota Madiun</p>
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <a href="/standee" class="px-3 py-1.5 bg-navy border border-warmTaupe/40 text-champagne hover:bg-sapphire rounded-xl text-xs font-semibold flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-qrcode"></i> Standee Barcode Depan
                </a>

                <a id="btnDownloadPdf" href="/api/invitations/pdf" class="px-3.5 py-1.5 bg-sapphire hover:bg-sapphire/80 text-champagne border border-champagne/40 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-file-pdf"></i> Download PDF (A6 Siap Cetak)
                </a>

                <button onclick="window.print()" class="px-4 py-1.5 bg-champagne hover:bg-champagne/90 text-navy rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md transition">
                    <i class="fa-solid fa-print"></i> Cetak Kartu (Ctrl+P)
                </button>
            </div>
        </div>
    </header>

    <!-- Cards Container -->
    <main class="max-w-6xl mx-auto p-8">
        <div id="cardsGrid" class="print-container flex flex-wrap justify-center gap-6">
            <p class="text-xs text-warmTaupe py-12 text-center w-full">Memuat kartu undangan instansi Madiun...</p>
        </div>
    </main>

    <script>
        async function loadCards() {
            try {
                const res = await fetch('/api/guests');
                const json = await res.json();
                renderCards(json.data || []);
            } catch (err) {
                console.error('Error fetching cards:', err);
            }
        }

        function renderCards(guests) {
            const grid = document.getElementById('cardsGrid');
            if (guests.length === 0) {
                grid.innerHTML = `<p class="text-xs text-warmTaupe py-12 text-center w-full">Tidak ada instansi yang ditemukan.</p>`;
                return;
            }

            grid.innerHTML = guests.map(g => {
                return `
                    <div class="invitation-badge">
                        <!-- Top Accent Line -->
                        <div style="background: linear-gradient(90deg, #3B507D, #BEB7A7, #E7E2CE); height: 4px; position: absolute; top: 0; left: 0; right: 0;"></div>

                        <!-- Card Header -->
                        <div class="text-center pt-1 z-10">
                            <div class="text-[7px] font-bold tracking-widest text-warmTaupe uppercase">OFFICIAL INVITATION PASS • EXHIBITION 2026</div>
                            <h2 class="text-sm font-extrabold text-champagne tracking-wider mt-0.5 font-luxury">MENEMBUS BATAS DIGITAL</h2>
                            <p class="text-[8px] text-ivory/80">Kolaborasi Talenta Muda & Artificial Intelligence</p>
                            
                            <div class="mt-1.5">
                                <span class="px-2.5 py-0.5 rounded-full text-[8.5px] uppercase tracking-wider bg-sapphire text-champagne border border-champagne/40 font-bold inline-block">
                                    ${g.category}
                                </span>
                            </div>
                        </div>

                        <!-- Institution Info -->
                        <div class="text-center my-auto py-2 border-y border-warmTaupe/25 z-10">
                            <p class="text-[7.5px] text-warmTaupe uppercase tracking-widest">KEPADA YTH. PERWAKILAN</p>
                            <h3 class="text-lg font-bold text-ivory tracking-wide leading-tight mt-0.5 font-luxury">${g.institution}</h3>
                        </div>

                        <!-- Formal Invitation Content Box with Waroeng Latte Details -->
                        <div class="my-auto z-10 p-3 rounded-xl bg-sapphire/35 border border-warmTaupe/25 text-center space-y-1.5">
                            <p class="text-[7.5px] font-bold text-champagne tracking-wider uppercase">
                                <i class="fa-solid fa-gem text-[6.5px] mr-1"></i> UNDANGAN RESMI KEHORMATAN
                            </p>
                            <p class="text-[7.5px] text-ivory/90 leading-relaxed italic">
                                "Dengan hormat mengundang kehadiran Bapak/Ibu dalam pagelaran karya inovasi dan kolaborasi talenta muda di era Artificial Intelligence."
                            </p>
                            
                            <div class="border-t border-warmTaupe/20 pt-1.5 space-y-0.5">
                                <p class="text-[8px] font-bold text-champagne">
                                    <i class="fa-regular fa-calendar-check mr-1"></i> Rabu, 11 November 2026 • 10.00 WIB
                                </p>
                                <p class="text-[8px] font-bold text-ivory">
                                    <i class="fa-solid fa-location-dot text-champagne mr-1"></i> Waroeng Latte
                                </p>
                                <p class="text-[6.8px] text-warmTaupe leading-tight">
                                    Jl. Cokroaminoto No.88, Kejuron, Pandean, Kec. Taman, Kota Madiun
                                </p>
                            </div>
                        </div>

                        <!-- Venue Verification Note -->
                        <div class="text-center z-10 space-y-0.5">
                            <p class="text-[7.5px] font-bold text-champagne uppercase tracking-wider">
                                VERIFIKASI KEDATANGAN DI VENUE
                            </p>
                            <p class="text-[7px] text-warmTaupe max-w-[260px] mx-auto leading-normal">
                                Setibanya di Waroeng Latte, pindai Barcode Kedatangan yang tersedia di meja depan bersama petugas penerima tamu.
                            </p>
                        </div>

                        <!-- Card Footer -->
                        <div class="text-center border-t border-warmTaupe/25 pt-1.5 text-[7px] text-warmTaupe space-y-0.5 z-10">
                            <p class="font-bold text-champagne">KOMITE PELAKSANA • DIGITAL AI INNOVATION LAB MADIUN</p>
                            <p>Tanda masuk resmi kemitraan • Mohon dibawa saat menghadiri acara</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.addEventListener('load', loadCards);
    </script>
</body>
</html>
