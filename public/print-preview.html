<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Undangan Cetak • Digital Work AI Exhibition: MENEMBUS BATAS DIGITAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyberBlack: '#050814',
                        cyberDark: '#080E21',
                        neonCyan: '#00F0FF',
                        neonBlue: '#0077FE',
                        neonPurple: '#BD00FF',
                        chromeWhite: '#FFFFFF',
                        chromeSilver: '#CBD5E1'
                    },
                    fontFamily: {
                        cyber: ['Orbitron', 'sans-serif'],
                        tech: ['Rajdhani', 'sans-serif'],
                        monoTech: ['Share Tech Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        .invitation-badge {
            width: 340px;
            height: 490px;
            background: linear-gradient(135deg, #050814 0%, #080E21 100%);
            color: #FFFFFF;
            position: relative;
            box-sizing: border-box;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 22px;
            border: 1.5px solid #00F0FF;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .invitation-badge::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 1px solid rgba(189, 0, 255, 0.5);
            border-radius: 10px;
            pointer-events: none;
        }

        @media print {
            body {
                background: #050814 !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .cards-container {
                display: block !important;
                padding: 0 !important;
            }
            .invitation-badge {
                page-break-after: always;
                break-inside: avoid;
                margin: 20px auto !important;
                box-shadow: none !important;
                border: 2px solid #00F0FF !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body class="bg-cyberBlack text-chromeWhite min-h-screen selection:bg-neonCyan selection:text-cyberBlack font-tech">

    <!-- Top Action Bar (Hidden on Print) -->
    <header class="no-print sticky top-0 z-40 bg-cyberDark/95 backdrop-blur border-b border-neonCyan/25 p-4 shadow-xl">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <a href="/" class="w-9 h-9 rounded-xl bg-cyberDark border border-neonCyan/40 flex items-center justify-center text-neonCyan hover:bg-neonCyan/20 transition">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <div>
                    <h1 class="text-sm sm:text-base font-bold text-neonCyan font-cyber flex items-center gap-2">
                        CETAK KARTU UNDANGAN MITRA
                        <span class="text-[10px] font-monoTech px-2 py-0.5 rounded bg-neonCyan/15 text-neonCyan border border-neonCyan/30">
                            A6 • TANPA BARCODE
                        </span>
                    </h1>
                    <p class="text-xs text-chromeSilver/70">Format A6 Siap Cetak (Tamu Memindai 1 Master Barcode di Venue)</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="window.print()" class="px-4 py-2 bg-gradient-to-r from-neonCyan to-neonPurple text-cyberBlack font-cyber font-extrabold rounded-xl text-xs shadow-lg transition hover:scale-105 flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> Cetak Semua (Ctrl+P)
                </button>
                <a href="/api/invitations/pdf" class="px-4 py-2 bg-cyberDark hover:bg-neonCyan/20 text-neonCyan border border-neonCyan/40 rounded-xl text-xs font-cyber font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-file-pdf"></i> Download PDF
                </a>
            </div>
        </div>
    </header>

    <!-- Cards Container -->
    <main class="cards-container max-w-6xl mx-auto p-6">
        <div id="cardsGrid" class="flex flex-wrap justify-center gap-6">
            <!-- Dynamically Rendered Cards -->
            <div class="p-8 text-center text-xs text-chromeSilver">Memuat kartu undangan...</div>
        </div>
    </main>

    <script>
        async function loadCards() {
            try {
                const res = await fetch('/api/guests');
                const json = await res.json();
                renderCards(json.data || []);
            } catch (err) {
                console.error('Error fetching cards:', err);
            }
        }

        function renderCards(guests) {
            const grid = document.getElementById('cardsGrid');
            if (guests.length === 0) {
                grid.innerHTML = `<p class="text-xs text-chromeSilver py-12 text-center w-full">Tidak ada instansi yang ditemukan.</p>`;
                return;
            }

            grid.innerHTML = guests.map(g => {
                return `
                    <div class="invitation-badge">
                        <!-- Top Accent Line -->
                        <div style="background: linear-gradient(90deg, #00F0FF, #0077FE, #BD00FF); height: 4px; position: absolute; top: 0; left: 0; right: 0;"></div>

                        <!-- Card Header -->
                        <div class="text-center pt-1 z-10 flex flex-col items-center">
                            <img src="/images/logo-header.png" alt="Digital Work AI Exhibition" class="h-10 w-auto object-contain mx-auto drop-shadow-[0_0_8px_rgba(0,240,255,0.4)]" />
                            
                            <div class="mt-1">
                                <span class="px-2.5 py-0.5 rounded text-[8px] uppercase tracking-wider bg-cyberDark text-neonCyan border border-neonCyan/40 font-cyber font-bold inline-block">
                                    ${g.category}
                                </span>
                            </div>
                        </div>

                        <!-- Institution Info -->
                        <div class="text-center my-auto py-2 border-y border-neonCyan/20 z-10">
                            <p class="text-[7.5px] font-tech text-chromeSilver uppercase tracking-widest">KEPADA YTH. PERWAKILAN</p>
                            <h3 class="text-lg font-bold text-chromeWhite tracking-wide leading-tight mt-0.5 font-cyber text-gradient-chrome">${g.institution}</h3>
                        </div>

                        <!-- Formal Invitation Content Box with Waroeng Latte Details -->
                        <div class="my-auto z-10 p-3 rounded-xl bg-cyberDark/90 border border-neonCyan/30 text-center space-y-1.5 shadow-inner">
                            <p class="text-[7.5px] font-bold text-neonCyan tracking-wider uppercase font-cyber">
                                <i class="fa-solid fa-gem text-[6.5px] mr-1 text-neonPurple"></i> UNDANGAN RESMI KEHORMATAN
                            </p>
                            <p class="text-[7.5px] text-chromeSilver leading-relaxed italic">
                                "Dengan hormat mengundang kehadiran Bapak/Ibu dalam pagelaran karya inovasi dan kolaborasi talenta muda di era Artificial Intelligence."
                            </p>
                            
                            <div class="border-t border-neonCyan/20 pt-1.5 space-y-0.5">
                                <p class="text-[8px] font-bold text-neonCyan font-cyber">
                                    <i class="fa-regular fa-calendar-check mr-1 text-neonPurple"></i> Rabu, 11 November 2026 • 10.00 WIB
                                </p>
                                <p class="text-[8px] font-bold text-chromeWhite">
                                    <i class="fa-solid fa-location-dot text-neonCyan mr-1"></i> Waroeng Latte Madiun
                                </p>
                                <p class="text-[6.8px] text-chromeSilver/70 leading-tight">
                                    Jl. Cokroaminoto No.88, Kejuron, Pandean, Kec. Taman, Kota Madiun
                                </p>
                            </div>
                        </div>

                        <!-- Venue Verification Note -->
                        <div class="text-center z-10 space-y-0.5">
                            <p class="text-[7.5px] font-bold text-neonCyan uppercase tracking-wider font-cyber">
                                VERIFIKASI KEDATANGAN DI VENUE
                            </p>
                            <p class="text-[7px] text-chromeSilver/70 max-w-[260px] mx-auto leading-normal">
                                Undangan ini tidak memerlukan barcode pribadi. Cukup bawa undangan ini dan pindai 1 Master Barcode di Meja Registrasi Waroeng Latte.
                            </p>
                        </div>

                        <!-- Footer Identification -->
                        <div class="border-t border-neonCyan/20 pt-1.5 flex justify-between items-center text-[7px] font-monoTech text-chromeSilver/60 z-10">
                            <span>KODE: ${g.qr_token}</span>
                            <span class="text-neonCyan">WAROENG LATTE • 2026</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.addEventListener('load', loadCards);
    </script>
</body>
</html>
